<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quotidien</title>
<meta name="description" content="Tâches et emploi du temps personnels">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quotidien">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Disposition : en-tête sobre, deux vues (Tâches, Semaine). Barre d'onglets en bas sur téléphone, dans l'en-tête sur grand écran.
   Typo : Bricolage Grotesque (titres), Public Sans (texte), IBM Plex Mono (heures, comme sur un tableau d'horaires). */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E7ECE9; --ink:#14201B; --muted:#58665F; --line:#D5DDD8;
  --accent:#1B6B58; --accent-ink:#FFFFFF; --accent-soft:#D9EBE4; --danger:#B3362B; --warn:#9A6200; --now:#D6453A;
  --ev1-bg:#D5EBE3; --ev1-fg:#124A3C; --ev2-bg:#D9E5F7; --ev2-fg:#1F427A; --ev3-bg:#F6E5C2; --ev3-fg:#6B4300;
  --ev4-bg:#F5D9E3; --ev4-fg:#7A2548; --ev5-bg:#E1E0F3; --ev5-fg:#3F4280;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18221E; --surface-2:#202C27; --ink:#E6EEE9; --muted:#9AAAA2; --line:#2B3A34;
    --accent:#5CC4A3; --accent-ink:#0B1511; --accent-soft:#1D3A31; --danger:#FF8A7D; --warn:#E8B04A; --now:#FF8A7D;
    --ev1-bg:#1D3A31; --ev1-fg:#9FE0C8; --ev2-bg:#1F3352; --ev2-fg:#A9C6F2; --ev3-bg:#4A3714; --ev3-fg:#F0CD86;
    --ev4-bg:#4B2336; --ev4-fg:#F2B2CB; --ev5-bg:#2F3158; --ev5-fg:#C3C4F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18221E; --surface-2:#202C27; --ink:#E6EEE9; --muted:#9AAAA2; --line:#2B3A34;
  --accent:#5CC4A3; --accent-ink:#0B1511; --accent-soft:#1D3A31; --danger:#FF8A7D; --warn:#E8B04A; --now:#FF8A7D;
  --ev1-bg:#1D3A31; --ev1-fg:#9FE0C8; --ev2-bg:#1F3352; --ev2-fg:#A9C6F2; --ev3-bg:#4A3714; --ev3-fg:#F0CD86;
  --ev4-bg:#4B2336; --ev4-fg:#F2B2CB; --ev5-bg:#2F3158; --ev5-fg:#C3C4F0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1080px;margin-inline:auto}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.date-line{color:var(--muted);margin-top:4px;font-size:14px}
.status{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;margin:18px 0 14px;flex-wrap:wrap}
.summary{font-weight:500;font-size:16px;min-width:0}
.sync{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"]::before{background:var(--accent)}
.sync[data-s="saving"]::before,.sync[data-s="slow"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--danger)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);
  border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:12.5px}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (min-width:760px){
  body{padding-bottom:48px}
  .tabs{position:static;display:flex;gap:4px;background:var(--surface-2);border:0;padding:4px;border-radius:12px}
  .tabs a{flex-direction:row;gap:8px;padding:8px 14px;font-size:14px}
  .tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
}

.banner{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:14px;color:var(--muted);font-size:14px}

.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--line);background:transparent}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
input[type=text],input[type=date],input[type=time]{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
input::placeholder{color:var(--muted)}

/* Tâches */
/* Encadré de création : une carte, un champ large avec badge d'emoji, une ligne de confirmation, des pastilles Jour et Heure */
.qa{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 6px 14px;margin-bottom:24px;transition:border-color .15s,box-shadow .15s}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qa-top{display:flex;align-items:center;gap:10px;padding:6px 6px 2px 8px}
.qa-emoji{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:21px;line-height:1}
.qa .qa-top input[type=text]{flex:1;min-width:0;border:0;border-radius:0;background:transparent;min-height:44px;padding:0;font-size:17px;font-weight:500}
.qa .qa-top input[type=text]:focus-visible{outline:none}
.qa-go{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.qa-preview{display:flex;align-items:center;gap:6px;margin:2px 16px 10px 58px;font-size:13px;font-weight:600;color:var(--accent);min-height:18px}
.qa-preview svg{flex:none}
.qa-preview.hint{color:var(--muted);font-weight:400}
.qa-preview.hint svg{display:none}
.qa-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 10px}
.qa-opts + .qa-opts{margin-top:8px}
/* Raccourcis : pastilles arrondies, pleines quand elles sont actives */
.qa .chip{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;color:var(--ink)}
.qa .chip svg,.pick svg{flex:none}
.qa .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.qa-sep{width:1px;height:22px;background:var(--line);margin:0 1px}
/* Sélecteurs : champs rectangulaires avec une flèche, bord accentué quand une valeur est choisie */
.pick{position:relative;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 9px 0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.pick .pick-t{font-variant-numeric:tabular-nums}
.pick::after{content:"";flex:none;width:6px;height:6px;margin:-3px 2px 0 2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);opacity:.55}
.pick.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.pick:not(:has(svg)){padding-left:11px}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pick .pick-in{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;border:0;padding:0;cursor:pointer}
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.grp-h .n{font-family:var(--f-mono);letter-spacing:0;background:var(--surface-2);border-radius:999px;padding:0 7px;font-size:11.5px}
.grp.late .grp-h{color:var(--danger)}
.grp-h.toggle{background:none;border:0;padding:6px 0;width:100%;text-align:left}
.tasks{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.task{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:none;width:52px;background:none;border:0;display:flex;align-items:center;justify-content:center;color:transparent}
.check svg{width:16px;height:16px;padding:3px;border-radius:50%;box-sizing:content-box;border:2px solid var(--muted);color:transparent}
.check[aria-pressed="true"] svg{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:12px 12px 12px 0;display:grid;gap:3px}
.task-title{overflow-wrap:anywhere}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.task-meta:empty{display:none}
.due.late{color:var(--danger);font-weight:600}
.flag{font-weight:600;color:var(--warn)}
.tag-ex{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 6px}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty-t{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);margin-bottom:4px}

/* Semaine */
.wk-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:12px}
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-label{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;min-width:9.5em;text-align:center}
.wk-actions{display:flex;gap:8px}
.strip{display:none;gap:6px;margin-bottom:12px}
.strip button{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0;display:grid;justify-items:center;gap:1px;font-size:12px;color:var(--muted)}
.strip button .num{font-family:var(--f-mono);font-size:15px;color:var(--ink);font-weight:500}
.strip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strip button[aria-pressed="true"] .num{color:var(--accent-ink)}
.strip button.is-today:not([aria-pressed="true"]) .num{color:var(--accent);font-weight:600}
.tt{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gutter-h,.col-h{height:66px;border-bottom:1px solid var(--line)}
.gutter{position:relative}
.gutter-b{position:relative}
.hl{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dcell{border-left:1px solid var(--line);min-width:0}
.col-h{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--muted);padding:0 4px}
.col-h .dd{font-family:var(--f-mono);font-size:15px;color:var(--ink);font-weight:500;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.dcell.today .dd{background:var(--accent);color:var(--accent-ink)}
.due-pill{background:none;border:0;padding:0;font-size:11px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.col-b{position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.gutter-b{background:none}
.ev{position:absolute;border:0;border-radius:6px;padding:3px 6px;overflow:hidden;text-align:left;background:var(--eb);color:var(--ef);display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.25;min-width:0}
.ev-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ev-m{font-family:var(--f-mono);font-size:10.5px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.long .ev-t{white-space:normal}
.c1{--eb:var(--ev1-bg);--ef:var(--ev1-fg)}.c2{--eb:var(--ev2-bg);--ef:var(--ev2-fg)}.c3{--eb:var(--ev3-bg);--ef:var(--ev3-fg)}
.c4{--eb:var(--ev4-bg);--ef:var(--ev4-fg)}.c5{--eb:var(--ev5-bg);--ef:var(--ev5-fg)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);pointer-events:none;z-index:2}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
@media (max-width:899px){
  .tt{grid-template-columns:44px minmax(0,1fr)}
  .dcell:not(.sel){display:none}
  .tk-t{-webkit-line-clamp:3}
  .strip{display:flex}
}

/* Fenêtres */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,11,.55);display:flex;align-items:flex-end;justify-content:center;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:560px){.overlay{align-items:center}.sheet{border-radius:18px;padding-bottom:20px}}
.sheet:focus,.sheet:focus-visible{outline:none}
.sheet-t{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.nowrap{flex-wrap:nowrap}
.err{color:var(--danger);font-size:14px;min-height:0}
.err:empty{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ef);background:var(--eb);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .chip{padding:0 10px;min-width:44px}
.ev.gen:not(.locked){outline:1.5px dashed var(--ef);outline-offset:-3px}

/* Tâches du jour dans la semaine : bandeau « à cocher », distinct des blocs colorés */
.gutter-t,.col-t{background:var(--surface-2);border-bottom:1px solid var(--line)}
.gutter-t{font-family:var(--f-mono);font-size:10px;color:var(--muted);padding:8px 4px 0 0;text-align:right;min-height:36px}
.col-t{display:grid;gap:4px;align-content:start;padding:6px 4px;min-height:36px}
.tk{display:flex;gap:6px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;line-height:1.25;min-width:0}
.tk-box{flex:none;width:16px;height:16px;margin-top:1px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0;position:relative}
.tk-box::after{content:"";position:absolute;inset:-9px}
.tk.done .tk-box{background:var(--accent);border-color:var(--accent)}
.tk-t{min-width:0;background:none;border:0;padding:0;text-align:left;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere;font-weight:500}
.tk.done .tk-t{text-decoration:line-through;color:var(--muted);font-weight:400}
.tk.late{border-color:var(--danger)}
.tk.late .tk-t{color:var(--danger)}
.tk-more{background:none;border:0;padding:2px 4px;font-size:11px;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:2px}
/* Jours fériés : teinte ambrée dérivée du jeton d'avertissement, donc valable en clair et en sombre */
.hol-n{font-size:10.5px;line-height:1.2;color:var(--warn);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h.hol,.col-b.hol{background-color:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.strip button.is-hol{position:relative}
.strip button.is-hol::after{content:"";position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.tk-time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Tâche placée à une heure dans la grille : fond neutre et bordure pleine, pour la distinguer des activités colorées */
.tkev{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--muted);flex-direction:row;align-items:flex-start;gap:6px;padding:3px 5px}
.tk-col{display:flex;flex-direction:column;min-width:0;gap:1px}
.tkev .tk-t{display:block;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.tkev.long .tk-t{white-space:normal;display:-webkit-box}
.tkev .ev-m{color:var(--muted)}
.tkev.done{opacity:.75}
.tkev.done .tk-box{background:var(--accent);border-color:var(--accent)}
.tkev.done .tk-t{text-decoration:line-through;color:var(--muted);font-weight:400}
.tkev.late{border-color:var(--danger)}
.tkev.late .tk-t{color:var(--danger)}

/* Activités */
.acts-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:18px}
.acts-hint{color:var(--muted);font-size:14px;max-width:44em;min-width:0}
.act{border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act-main{width:100%;background:none;border:0;text-align:left;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--eb);border:2px solid var(--ef)}
.act-txt{display:grid;gap:2px;min-width:0}
.act-name{font-weight:600;overflow-wrap:anywhere}
.act-goal{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.act-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right}

const fromYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dow = d => (d.getDay() + 6) % 7;
const weekStart = d => addDays(d, -dow(d));
const toMin = s => { const p = s.split(':').map(Number); return p[0] * 60 + p[1]; };

function plusMin(t, m) {
  const x = Math.min(toMin(t) + m, 23 * 60 + 59);

function frHolidays(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);

function pickEmoji(title) {
  const s = String(title || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’]/g, ' ');
  for (const r of EMOJI_RULES) if (r[0].test(s)) return r[1];
  return '📌';
}

function parseQuick(text, now) {
  now = now || new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const original = text.trim();
  let title = original, due = '';
  const END = '(?=$|[\\s.,!?;])';
  const LEAD = '(?:(?:pour|avant|d[\'’]ici)\\s+)?(?:(?:le|ce)\\s+)?';
  const rules = [
    [new RegExp('(^|\\s)' + LEAD + 'apr[eè]s[- ]demain' + END, 'i'), () => 2],
    [new RegExp('(^|\\s)' + LEAD + 'demain' + END, 'i'), () => 1],
    [new RegExp('(^|\\s)' + LEAD + 'aujourd[\'’]?hui' + END, 'i'), () => 0],
    [new RegExp('(^|\\s)' + LEAD + 'dans\\s+(\\d{1,3})\\s+jours?' + END, 'i'), m => Number(m[2])],
    [new RegExp('(^|\\s)' + LEAD + '(' + WD.join('|') + ')(?:\\s+prochain)?' + END, 'i'), m => {
      const diff = (WD.indexOf(m[2].toLowerCase()) - dow(base) + 7) % 7;
      return diff === 0 ? 7 : diff;
    }]
  ];
  for (const r of rules) {
    const m = title.match(r[0]);
    if (m) {
      due = ymd(addDays(base, r[1](m)));
      title = title.replace(r[0], '$1').replace(/\s{2,}/g, ' ').trim();
      break;
    }
  }
  let time = '';
  const tr = new RegExp('(^|\\s)(?:[àa]\\s+)?(\\d{1,2})\\s*(?:h|:)\\s*(\\d{2})?' + END, 'i');
  const tm = title.match(tr);
  if (tm && Number(tm[2]) < 24 && (!tm[3] || Number(tm[3]) < 60)) {
    time = pad(Number(tm[2])) + ':' + (tm[3] || '00');
    title = title.replace(tr, '$1').replace(/\s{2,}/g, ' ').trim();
  }
  let end = '';
  const sr = new RegExp('(^|\\s)(?:(?:ce|le|en)\\s+)?(?:[àa]\\s+)?(soir|midi)' + END, 'i');
  const sm = title.match(sr);
  if (sm) {
    title = title.replace(sr, '$1').replace(/\s{2,}/g, ' ').trim();
    if (!time) {
      if (sm[2].toLowerCase() === 'midi') { time = '12:00'; end = '14:00'; } else { time = '19:00'; end = '23:00'; }
    }
  }
  if (!title) return { title: original, due: '', time: '', end: '' };
  return { title: title, due: due, time: time, end: end };
}

function layoutDay(evs) {
  const items = evs.map(e => ({ e: e, s: toMin(e.start), f: toMin(e.end) })).sort((a, b) => a.s - b.s || b.f - a.f);
  const out = [];
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const lanes = [];
    cluster.forEach(it => {
      let l = lanes.findIndex(end => end <= it.s);
      if (l === -1) { l = lanes.length; lanes.push(it.f); } else lanes[l] = it.f;
      it.lane = l;
    });
    cluster.forEach(it => { it.lanes = lanes.length; out.push(it); });
    cluster = [];
  };
  items.forEach(it => {
    if (it.s >= clusterEnd) { flush(); clusterEnd = it.f; } else clusterEnd = Math.max(clusterEnd, it.f);
    cluster.push(it);
  });
  flush();
  return out;
}
function freeWindow(busy, ws, we, minLen) {
  const iv = busy.map(b => [Math.max(b[0], ws), Math.min(b[1], we)]).filter(b => b[1] > b[0]).sort((a, b) => a[0] - b[0]);
  let best = null, cur = ws;
  const consider = (a, b) => { if (b - a >= minLen && (!best || b - a > best[1] - best[0])) best = [a, b]; };
  iv.forEach(b => { if (b[0] > cur) consider(cur, b[0]); cur = Math.max(cur, b[1]); });
  consider(cur, we);
  return best;
}

function planWeek(acts, slots, usedByDay, rng) {
  const n = slots.length, out = new Array(n).fill(null);
  if (!n || !acts.length) return out;
  const W = acts.reduce((s, a) => s + a.weight, 0);
  const counts = {};
  let given = 0;
  const rem = acts.map(a => {
    const x = n * a.weight / W;
    counts[a.id] = Math.floor(x);
    given += counts[a.id];
    return { id: a.id, f: x - Math.floor(x) + rng() * 1e-6 };
  }).sort((a, b) => b.f - a.f);
  for (let i = 0; given < n; i++, given++) counts[rem[i % rem.length].id]++;
  if (n >= acts.length) {
    acts.forEach(a => {
      if (counts[a.id] === 0) {
        const big = acts.slice().sort((x, y) => counts[y.id] - counts[x.id])[0];
        counts[big.id]--; counts[a.id]++;
      }
    });
  }
  const used = {};
  Object.keys(usedByDay).forEach(k => { used[k] = usedByDay[k].slice(); });
  let prev = null;
  slots.forEach((s, i) => {
    const u = used[s.day] || (used[s.day] = []);
    const left = acts.filter(a => counts[a.id] > 0);
    const tiers = [
      left.filter(a => u.indexOf(a.id) === -1 && a.id !== prev),
      left.filter(a => u.indexOf(a.id) === -1),
      left
    ];
    const pool = tiers.find(t => t.length) || acts;
    const pick = pool.slice().sort((a, b) => (counts[b.id] - counts[a.id]) || (rng() - 0.5))[0];
    counts[pick.id] = Math.max(0, counts[pick.id] - 1);
    u.push(pick.id); prev = pick.id; out[i] = pick.id;
  });
  return out;
}

function defaultGen() { return { days: [0, 1, 2, 3, 4], am: ['09:00', '12:00'], pm: ['14:00', '17:00'] }; }

/* ---------- Stockage : copie locale + synchronisation (db) ---------- */
let db = null, userId = null, dbBroken = false, localMode = false;
const synced = { todo: false, planning: false };
const q = { todo: { timer: 0, busy: false, dirty: false }, planning: { timer: 0, busy: false, dirty: false } };

const SYNC_TEXT = { connecting: 'Connexion…', saving: 'Enregistrement…', ok: 'Synchronisé', slow: 'Connexion lente', local: 'Sur cet appareil seulement', err: 'Synchro en échec, nouvel essai…' };
function setSync(s) { const n = $('#sync'); n.dataset.s = s; n.textContent = SYNC_TEXT[s]; }

function readLocal(key) { try { const s = localStorage.getItem('qd.v1.' + key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function writeLocal(key) { try { localStorage.setItem('qd.v1.' + key, JSON.stringify(payload(key))); } catch (e) {} }

function save(key) {
  writeLocal(key);
  if (!db || dbBroken) return;
  const s = q[key];
  s.dirty = true;
  setSync('saving');
  clearTimeout(s.timer);
  s.timer = setTimeout(() => flush(key), 400);
}
async function flush(key) {
  const s = q[key];
  if (s.busy || !s.dirty) return;
  s.busy = true; s.dirty = false;
  let failed = false;
  try {
    await db.doc('data/users/' + userId + '/' + key).set(Object.assign({}, clone(payload(key)), { updatedAt: Date.now() }));
  } catch (e) {
    failed = true;
    if (e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded' || e.code === 'revoked')) { dbBroken = true; }
    else s.dirty = true;
  }
  s.busy = false;
  if (failed) {
    if (dbBroken) { setSync('local'); return; }
    setSync('err');
    clearTimeout(s.timer);
    s.timer = setTimeout(() => flush(key), 8000);
    return;
  }
  if (s.dirty) { flush(key); return; }
  if (!q.todo.busy && !q.todo.dirty && !q.planning.busy && !q.planning.dirty) setSync('ok');
}

function seed(key, persist) {
  const t = new Date();
  const d = n => ymd(addDays(t, n));
  const now = Date.now();
  if (key === 'todo') {
    state.tasks = [
      { id: uid8(), title: 'Payer la facture d\'électricité', due: d(-1), prio: 1, done: false, created: now - 5, ex: true },
      { id: uid8(), title: 'Préparer l\'ordre du jour de la réunion', due: d(0), time: '11:00', end: '11:30', prio: 1, done: false, created: now - 4, ex: true },
      { id: uid8(), title: 'Rendre le livre à la médiathèque', due: d(1), prio: 0, done: false, created: now - 3, ex: true },
      { id: uid8(), title: 'Prototype d\'outil à tester ce week-end', due: '', prio: 0, done: false, created: now - 2, ex: true },
      { id: uid8(), title: 'Envoyer le compte rendu', due: d(-2), prio: 0, done: true, doneAt: now - 1, created: now - 6, ex: true }
    ];
  } else {
    state.events = [
      { id: uid8(), title: 'Réunion d\'équipe', start: '09:30', end: '10:00', days: [0, 2], date: '', color: 2, place: '', ex: true },
      { id: uid8(), title: 'Sport', start: '18:30', end: '19:30', days: [2], date: '', color: 4, place: 'Salle', ex: true },
      { id: uid8(), title: 'Courses', start: '10:00', end: '11:00', days: [5], date: '', color: 3, place: '', ex: true }
    ];
    state.activities = exampleActivities();
    state.gen = defaultGen();
  }
  state.known[key] = true;
  if (persist === false) writeLocal(key); else save(key);
}

function subscribe(key) {
  const ref = db.doc('data/users/' + userId + '/' + key);
  ref.onSnapshot(snap => {
    const m = snap.metadata;
    if (m.hasPendingWrites) return;
    if (!m.fromCache) {
      synced[key] = true;
      if (synced.todo && synced.planning && !q.todo.dirty && !q.planning.dirty && !q.todo.busy && !q.planning.busy) setSync('ok');
    }
    if (q[key].dirty || q[key].busy) return;
    if (snap.exists) {
      const d = snap.data() || {};
      let needSave = false;
      if (key === 'todo') state.tasks = clone(d.tasks || []);
      else {
        state.events = clone(d.events || []);
        state.gen = d.gen ? clone(d.gen) : defaultGen();
        state.seeded = Array.isArray(d.seeded) ? d.seeded.slice() : [];
        if (Array.isArray(d.activities)) state.activities = clone(d.activities);
        else { state.activities = exampleActivities(); needSave = !m.fromCache; }
      }
      state.known[key] = true;
      writeLocal(key);
      render();
      if (needSave) save(key);
    } else if (!m.fromCache) {
      if (state.known[key]) save(key); else seed(key);
      render();
    }
  }, err => {
    dbBroken = true;
    setSync('local');
    if (!state.known[key]) seed(key, false);
    render();
  });
}

function localOnly() {
  ['todo', 'planning'].forEach(k => { if (!state.known[k]) seed(k, false); });
  localMode = true;
  setSync('local');
  render();
}

async function initSync() {
  if (!window.claude || typeof window.claude.use !== 'function') { localOnly(); return; }
  let d = null, u = null;
  try { d = await window.claude.use('db'); u = await window.claude.use('user'); } catch (e) {}
  let id = null;
  try { id = u ? await u.id() : null; } catch (e) {}
  if (!d || !id) { localOnly(); return; }
  db = d; userId = id;
  setTimeout(() => { if (!(synced.todo && synced.planning)) setSync('slow'); }, 10000);
  subscribe('todo');
  subscribe('planning');
}

/* ---------- Données dérivées ---------- */
function dueLabel(due) {
  const n = Math.round((fromYmd(due) - fromYmd(todayStr())) / 864e5);
  if (n === 0) return 'Aujourd\'hui';
  if (n === 1) return 'Demain';
  if (n === -1) return 'Hier';
  if (n < 0) return 'Il y a ' + (-n) + ' j';
  if (n < 7) return fr(fromYmd(due), { weekday: 'long' });
  return fr(fromYmd(due), { day: 'numeric', month: 'short' });
}
function groups() {
  const t = todayStr();
  const open = state.tasks.filter(x => !x.done);
  const cmp = (a, b) => ((b.prio | 0) - (a.prio | 0)) || (((a.due || '9') < (b.due || '9')) ? -1 : ((a.due || '9') > (b.due || '9')) ? 1 : 0) || (a.created - b.created);
  return {
    late: open.filter(x => x.due && x.due < t).sort(cmp),
    today: open.filter(x => x.due === t).sort(cmp),
    soon: open.filter(x => x.due && x.due > t).sort(cmp),
    none: open.filter(x => !x.due).sort(cmp),
    done: state.tasks.filter(x => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0))
  };
}
function actById(id) { return state.activities.find(a => a.id === id); }
function viewEv(e) { const a = e.act ? actById(e.act) : null; return a ? Object.assign({}, e, { title: a.name, color: a.color }) : e; }
function eventsOn(d, list) {
  const i = dow(d), s = ymd(d);
  const r = (list || state.events).filter(e => (e.days && e.days.length) ? e.days.indexOf(i) !== -1 : e.date === s);
  return list ? r : r.map(viewEv);
}
function openTasksOn(s) { return state.tasks.filter(t => !t.done && t.due === s).length; }

/* Ces dates sont des tâches avec échéance et heure : elles apparaissent dans la liste, le bandeau et la grille.
   Les blocs d'événement posés par une version précédente sont retirés pour éviter le doublon. */
const CHESS_TASKS_PACK = 'echecs-2026-27-taches';
function applyTaskPack() {
  if (!state.known.todo || !state.known.planning || state.seeded.indexOf(CHESS_TASKS_PACK) !== -1) return;
  if (!((synced.todo && synced.planning) || dbBroken || localMode)) return;
  state.seeded.push(CHESS_TASKS_PACK);
  const t = todayStr();
  let n = 0;
  CHESS.forEach(c => {
    if (c.date < t || state.tasks.some(x => x.pack === c.id)) return;
    state.tasks.push({ id: uid8(), title: c.title, emoji: pickEmoji(c.title), due: c.date, time: c.start, end: c.end, done: false, created: Date.now() + n, pack: c.id });
    n++;
  });
  state.events = state.events.filter(e => !e.pack);
  save('todo'); save('planning');
  if (n) toast(n + ' dates d\'échecs ajoutées aux tâches', () => { state.tasks = state.tasks.filter(x => !x.pack); save('todo'); render(); });
}
/* Les tâches déjà présentes, sans emoji, en reçoivent un une fois (un emoji vidé à la main reste vide) */
function fillEmoji() {
  if (!state.known.todo || !(synced.todo || dbBroken || localMode)) return;
  let changed = false;
  state.tasks.forEach(t => {
    if (t.emoji === undefined || t.emoji === '📌') {
      const e = pickEmoji(t.title);
      if (e !== t.emoji) { t.emoji = e; changed = true; }
    }
  });
  if (changed) save('todo');
}

function applyImport() {
  if (!state.known.todo || !state.known.planning || state.seeded.indexOf(IMPORT_PACK) !== -1) return;
  if (!(localMode || dbBroken || (synced.todo && synced.planning))) return;
  state.seeded.push(IMPORT_PACK);
  if (state.seeded.indexOf(CHESS_TASKS_PACK) === -1) state.seeded.push(CHESS_TASKS_PACK);
  state.tasks = state.tasks.filter(x => !x.ex).concat(IMPORT_DATA.tasks.filter(x => !state.tasks.some(y => y.id === x.id)));
  state.events = state.events.filter(x => !x.ex);
  state.activities = IMPORT_DATA.activities.map(a => Object.assign({}, a));
  state.gen = Object.assign({}, IMPORT_DATA.gen);
  save('todo'); save('planning');
}
function applyPacks() { applyImport(); applyTaskPack(); fillEmoji(); }

function render() {
  applyPacks();
  renderHeader();
  renderBanner();
  $('#view-taches').hidden = state.tab !== 'taches';
  $('#view-semaine').hidden = state.tab !== 'semaine';
  $('#view-activites').hidden = state.tab !== 'activites';
  if (state.tab === 'taches') renderTasks(); else if (state.tab === 'semaine') renderWeek(); else renderActs();
}

function renderHeader() {
  const now = new Date();
  $('#today').textContent = fr(now, { weekday: 'long', day: 'numeric', month: 'long' });
  document.querySelectorAll('.tabs a').forEach(a => {
    if (a.dataset.tab === state.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  let txt = '';
  if (state.tab === 'taches') {
    const g = groups();
    const parts = [];
    parts.push(g.today.length ? g.today.length + (g.today.length > 1 ? ' tâches' : ' tâche') + ' pour aujourd\'hui' : 'Rien d\'échu aujourd\'hui');
    if (g.late.length) parts.push(g.late.length + ' en retard');
    txt = parts.join(' · ');
  } else if (state.tab === 'activites') {
    const m = state.activities.filter(a => a.horizon === 'moyen').length, l = state.activities.filter(a => a.horizon === 'long').length;
    txt = state.activities.length ? m + ' à moyen terme · ' + l + ' à long terme' : 'Aucune activité définie';
  } else {
    const evs = eventsOn(now).slice().sort((a, b) => toMin(a.start) - toMin(b.start));
    const nm = now.getHours() * 60 + now.getMinutes();
    const next = evs.find(e => toMin(e.end) > nm);
    if (!evs.length) txt = 'Rien de prévu aujourd\'hui';
    else if (!next) txt = 'Plus rien de prévu aujourd\'hui';
    else txt = (toMin(next.start) <= nm ? 'En cours : ' : 'Prochain : ') + next.title + ' à ' + next.start;
  }
  const todayHol = holidayOf(todayStr());
  if (todayHol) txt = 'Jour férié : ' + todayHol + ' · ' + txt;
  $('#summary').textContent = txt;
}

function renderBanner() {
  $('#ex-banner').hidden = !(state.tasks.some(t => t.ex) || state.events.some(e => e.ex) || state.activities.some(a => a.ex));
}

function taskRow(t) {
  const lbl = t.due ? dueLabel(t.due) : '';
  const late = !t.done && t.due && t.due < todayStr();
  const meta = '' +
    (lbl ? '<span class="due' + (late ? ' late' : '') + '">' + esc(lbl + (t.time ? ' · ' + t.time : '')) + '</span>' : '') +
    (t.ex ? '<span class="tag-ex">exemple</span>' : '');
  return '<li class="task' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
    '<button type="button" class="check" data-act="toggle" aria-pressed="' + (t.done ? 'true' : 'false') + '" aria-label="' + (t.done ? 'Rouvrir' : 'Terminer') + ' : ' + esc(t.title) + '">' + ICON_CHECK + '</button>' +
    '<button type="button" class="task-main" data-act="edit"><span class="task-title">' + esc((t.emoji ? t.emoji + ' ' : '') + t.title) + '</span><span class="task-meta">' + meta + '</span></button></li>';
}

function renderTasks() {
  const g = groups();
  const sec = (cls, title, arr) => arr.length ? '<section class="grp ' + cls + '"><h2 class="grp-h">' + title + '<span class="n">' + arr.length + '</span></h2><ul class="tasks">' + arr.map(taskRow).join('') + '</ul></section>' : '';
  let html = sec('late', 'En retard', g.late) + sec('today', 'Aujourd\'hui', g.today) + sec('soon', 'À venir', g.soon) + sec('none', 'Sans date', g.none);
  if (!html) {
    html = state.known.todo
      ? '<div class="empty"><p class="empty-t">Tout est fait.</p><p>Ajoute une tâche ci-dessus. Écrire « jeudi » ou « demain » dans le texte fixe l\'échéance.</p></div>'
      : '<div class="empty"><p class="empty-t">Chargement de tes tâches…</p><p>Elles apparaissent ici dès que la synchro répond.</p></div>';
  }
  if (g.done.length) {
    html += '<section class="grp"><button type="button" class="grp-h toggle" data-act="toggle-done" aria-expanded="' + state.showDone + '">Terminées<span class="n">' + g.done.length + '</span>' + ICON_CHEV + '</button>' +
      (state.showDone ? '<ul class="tasks">' + g.done.map(taskRow).join('') + '</ul>' : '') + '</section>';
  }
  $('#task-list').innerHTML = html;
}

function renderWeek() {
  const ws = addDays(weekStart(new Date()), state.weekOffset * 7);
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
  const byDay = days.map(d => eventsOn(d));
  let minH = 7, maxH = 21;
  byDay.forEach(l => l.forEach(e => {
    minH = Math.min(minH, Math.floor(toMin(e.start) / 60));
    maxH = Math.max(maxH, Math.min(24, Math.ceil(toMin(e.end) / 60)));
  }));
  const d0s = ymd(days[0]), d6s = ymd(days[6]);
  state.tasks.forEach(tk => {
    if (tk.time && tk.due >= d0s && tk.due <= d6s) {
      minH = Math.min(minH, Math.floor(toMin(tk.time) / 60));
      maxH = Math.max(maxH, Math.min(24, Math.ceil(toMin(tk.end || plusMin(tk.time, 30)) / 60)));
    }
  });
  const hh = 48, bodyH = (maxH - minH) * hh;
  const d0 = days[0], d6 = days[6];
  $('#wk-label').textContent = d0.getDate() + (d0.getMonth() !== d6.getMonth() ? ' ' + fr(d0, { month: 'short' }) : '') + '–' + d6.getDate() + ' ' + fr(d6, { month: 'short' }) + ' ' + d6.getFullYear();

  const now = new Date(), tStr = ymd(now), nowMin = now.getHours() * 60 + now.getMinutes();
  $('#strip').innerHTML = days.map((d, i) =>
    '<button type="button" data-sel="' + i + '" aria-pressed="' + (i === state.selDay) + '" class="' + (ymd(d) === tStr ? 'is-today' : '') + (holidayOf(ymd(d)) ? ' is-hol' : '') + '"><span>' + DAY_ABBR[i] + '</span><span class="num">' + d.getDate() + '</span></button>').join('');

  let hl = '';
  for (let h = minH; h <= maxH; h++) hl += '<span class="hl" style="top:' + ((h - minH) * hh) + 'px">' + pad(h) + ':00</span>';
  const hArr = ['<div class="gutter-h"></div>'], tArr = ['<div class="gutter-t">Tâches</div>'];
  const bArr = ['<div class="gutter-b" style="height:' + bodyH + 'px">' + hl + '</div>'];

  days.forEach((d, i) => {
    const s = ymd(d);
    const dayTasks = state.tasks.filter(tk => tk.due === s || (s === tStr && !tk.done && tk.due && tk.due < tStr))
      .sort((a, b) => (a.done - b.done) || (((a.time || '99') < (b.time || '99')) ? -1 : ((a.time || '99') > (b.time || '99')) ? 1 : 0) || (a.created - b.created));
    const cap = 4;
    const tkHtml = dayTasks.slice(0, cap).map(tk => {
      const late = !tk.done && tk.due < tStr;
      return '<div class="tk' + (tk.done ? ' done' : '') + (late ? ' late' : '') + '">' +
        '<button type="button" class="tk-box" data-tk-toggle="' + tk.id + '" aria-pressed="' + (tk.done ? 'true' : 'false') + '" aria-label="' + (tk.done ? 'Rouvrir' : 'Terminer') + ' : ' + esc(tk.title) + '"></button>' +
        '<button type="button" class="tk-t" data-tk-edit="' + tk.id + '">' + (tk.time ? '<span class="tk-time">' + tk.time + '</span> ' : '') + esc((tk.emoji ? tk.emoji + ' ' : '') + tk.title) + '</button></div>';
    }).join('') + (dayTasks.length > cap ? '<button type="button" class="tk-more" data-goto-tasks>+ ' + (dayTasks.length - cap) + ' autre' + (dayTasks.length - cap > 1 ? 's' : '') + '</button>' : '');
    const isToday = s === tStr;
    let evh = '';
    const gridTasks = state.tasks.filter(tk => tk.due === s && tk.time).map(tk => ({ id: tk.id, title: (tk.emoji ? tk.emoji + ' ' : '') + tk.title, start: tk.time, end: tk.end || plusMin(tk.time, 30), task: true, done: tk.done, late: !tk.done && tk.due < tStr }));
    layoutDay(byDay[i].concat(gridTasks)).forEach(it => {
      const top = (it.s / 60 - minH) * hh;
      const h = Math.max((it.f - it.s) / 60 * hh, 24);
      const e = it.e;
      const long = h >= 56;
      if (e.task) {
        evh += '<div class="ev tkev' + (e.done ? ' done' : '') + (e.late ? ' late' : '') + (long ? ' long' : '') + '" style="top:' + top + 'px;height:' + h + 'px;left:calc(' + (it.lane / it.lanes * 100) + '% + 2px);width:calc(' + (100 / it.lanes) + '% - 4px)">' +
          '<button type="button" class="tk-box" data-tk-toggle="' + e.id + '" aria-pressed="' + (e.done ? 'true' : 'false') + '" aria-label="' + (e.done ? 'Rouvrir' : 'Terminer') + ' : ' + esc(e.title) + '"></button>' +
          '<span class="tk-col"><button type="button" class="tk-t" data-tk-edit="' + e.id + '">' + esc(e.title) + '</button>' + (h >= 40 ? '<span class="ev-m">' + e.start + '–' + e.end + '</span>' : '') + '</span></div>';
        return;
      }
      evh += '<button type="button" class="ev c' + (e.color || 1) + (long ? ' long' : '') + (e.gen ? (e.locked ? ' gen locked' : ' gen') : '') + '" data-ev="' + e.id + '" style="top:' + top + 'px;height:' + h + 'px;left:calc(' + (it.lane / it.lanes * 100) + '% + 2px);width:calc(' + (100 / it.lanes) + '% - 4px)" aria-label="' + esc(e.title) + ', ' + e.start + ' à ' + e.end + '">' +
        '<span class="ev-t">' + esc(e.title) + '</span>' +
        (h >= 40 ? '<span class="ev-m">' + e.start + '–' + e.end + (e.place ? ' · ' + esc(e.place) : '') + '</span>' : '') + '</button>';
    });
    if (isToday && nowMin >= minH * 60 && nowMin <= maxH * 60) evh += '<div class="now" style="top:' + ((nowMin / 60 - minH) * hh) + 'px"></div>';
    const cc = 'dcell' + (isToday ? ' today' : '') + (i === state.selDay ? ' sel' : '');
    const hn = holidayOf(s);
    hArr.push('<div class="' + cc + (hn ? ' hol' : '') + ' col-h"><span>' + DAY_ABBR[i] + '</span><span class="dd">' + d.getDate() + '</span>' + (hn ? '<span class="hol-n" title="' + esc(hn) + '">' + esc(hn) + '</span>' : '') + '</div>');
    tArr.push('<div class="' + cc + ' col-t">' + tkHtml + '</div>');
    bArr.push('<div class="' + cc + (hn ? ' hol' : '') + ' col-b" data-day="' + i + '" data-minh="' + minH + '" style="height:' + bodyH + 'px">' + evh + '</div>');
  });
  $('#timetable').innerHTML = hArr.join('') + tArr.join('') + bArr.join('');
}

/* ---------- Fenêtres (feuilles) ---------- */
const sheetRoot = $('#sheet-root');
let lastFocus = null;
function openSheet(html, mount) {
  lastFocus = document.activeElement;
  sheetRoot.innerHTML = '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' + html + '</div></div>';
  const sheet = $('.sheet', sheetRoot);
  /* Écran tactile : pas de clavier qui s'ouvre tout seul, le focus reste sur la fenêtre. Ordinateur : focus sur le premier champ. */
  const touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if (touch) { sheet.setAttribute('tabindex', '-1'); sheet.focus({ preventScroll: true }); }
  else { const first = sheet.querySelector('input[type=text]'); if (first) first.focus(); }
  if (mount) mount(sheet);
}
function closeSheet() {
  sheetRoot.innerHTML = '';
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  lastFocus = null;
}
sheetRoot.addEventListener('click', e => {
  if (e.target.classList.contains('overlay') || e.target.closest('.js-close')) closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetRoot.firstChild) closeSheet(); });

function armDelete(btn, onConfirm) {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { onConfirm(); return; }
    btn.classList.add('armed');
    btn.textContent = 'Confirmer la suppression';
  });
}

function openTaskSheet(t) {
  openSheet(
    '<h2 id="sheet-title" class="sheet-t">Modifier la tâche</h2>' +
    '<form id="tf" class="form" autocomplete="off">' +
    '<div class="field"><label for="tf-title">Intitulé</label><input id="tf-title" type="text" maxlength="140" value="' + esc(t.title) + '"></div>' +
    '<div class="field"><label for="tf-emoji">Emoji (choisi automatiquement, modifiable)</label><input id="tf-emoji" type="text" maxlength="8" value="' + esc(t.emoji || '') + '"></div>' +
    '<div class="field"><label for="tf-due">Échéance</label><div class="row nowrap"><input id="tf-due" type="date" value="' + esc(t.due || '') + '"><button type="button" class="btn ghost" id="tf-clear">Effacer</button></div></div>' +
    '<div class="field"><span class="lbl">Heure dans le calendrier (facultatif)</span><div class="row nowrap"><input id="tf-ts" type="time" value="' + esc(t.time || '') + '" aria-label="Début"><input id="tf-te" type="time" value="' + esc(t.end || '') + '" aria-label="Fin"><button type="button" class="btn ghost" id="tf-tclear">Effacer</button></div></div>' +
    '<div class="field"><span class="lbl">Raccourcis</span><div class="row"><button type="button" class="chip" data-q="today">Aujourd\'hui</button><button type="button" class="chip" data-q="tomorrow">Demain</button><button type="button" class="chip" data-q="midi">Midi</button><button type="button" class="chip" data-q="soir">Soir</button></div></div>' +
    '<p id="tf-err" class="err" role="alert"></p>' +
    '<div class="actions"><button type="button" class="btn danger" id="tf-del">Supprimer</button><span class="sp"></span><button type="button" class="btn ghost js-close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>' +
    '</form>',
    sheet => {
      $('#tf-clear', sheet).addEventListener('click', () => { $('#tf-due', sheet).value = ''; });
      $('#tf-tclear', sheet).addEventListener('click', () => { $('#tf-ts', sheet).value = ''; $('#tf-te', sheet).value = ''; });
      sheet.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.q, dueIn = $('#tf-due', sheet);
        if (k === 'today') dueIn.value = todayStr();
        else if (k === 'tomorrow') dueIn.value = ymd(addDays(new Date(), 1));
        else {
          $('#tf-ts', sheet).value = k === 'midi' ? '12:00' : '19:00';
          $('#tf-te', sheet).value = k === 'midi' ? '14:00' : '23:00';
          if (!dueIn.value) dueIn.value = todayStr();
        }
      }));
      armDelete($('#tf-del', sheet), () => {
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        save('todo'); closeSheet(); render();
      });
      $('#tf', sheet).addEventListener('submit', ev => {
        ev.preventDefault();
        const title = $('#tf-title', sheet).value.trim();
        if (!title) { $('#tf-err', sheet).textContent = 'Donne un intitulé à la tâche.'; return; }
        const due = $('#tf-due', sheet).value || '', ts = $('#tf-ts', sheet).value, te = $('#tf-te', sheet).value;
        const tfErr = m => { $('#tf-err', sheet).textContent = m; };
        if (te && !ts) return tfErr('Renseigne aussi l\'heure de début.');
        if (ts && !due) return tfErr('Choisis une échéance pour placer la tâche dans le calendrier.');
        if (ts && te && toMin(te) <= toMin(ts)) return tfErr('L\'heure de fin doit être après le début.');
        const emField = $('#tf-emoji', sheet).value.trim(), oldEm = t.emoji || '';
        const autoFollow = emField === oldEm && title !== t.title && oldEm === pickEmoji(t.title);
        t.emoji = autoFollow ? pickEmoji(title) : emField;
        t.title = title; t.due = due; t.time = ts; t.end = ts ? (te || plusMin(ts, 30)) : ''; delete t.ex;
        save('todo'); closeSheet(); render();
      });
    });
}

function openEventSheet(ev, preset) {
  preset = preset || {};
  const isNew = !ev;
  const e = ev || { title: '', start: preset.start || '09:00', end: preset.end || '10:00', days: [preset.day != null ? preset.day : state.selDay], date: preset.date || todayStr(), color: 1, place: '' };
  let rep = (e.days && e.days.length) ? 'weekly' : 'once';
  const days = new Set(e.days || []);
  let color = e.color || 1;
  const dayChips = DAY_ABBR.map((n, i) => '<button type="button" class="chip" data-d="' + i + '" aria-pressed="' + days.has(i) + '" aria-label="' + DAY_LONG[i] + '">' + n + '</button>').join('');
  const sw = COLOR_NAMES.map((n, i) => '<button type="button" class="sw c' + (i + 1) + '" data-c="' + (i + 1) + '" aria-pressed="' + (color === i + 1) + '" aria-label="' + n + '"></button>').join('');
  openSheet(
    '<h2 id="sheet-title" class="sheet-t">' + (isNew ? 'Nouvel événement' : 'Modifier l\'événement') + '</h2>' +
    '<form id="ef" class="form" autocomplete="off">' +
    '<div class="field"><label for="ef-title">Titre</label><input id="ef-title" type="text" maxlength="80" value="' + esc(e.title) + '"></div>' +
    '<div class="field"><span class="lbl">Répétition</span><div class="row"><button type="button" class="chip" data-r="weekly" aria-pressed="' + (rep === 'weekly') + '">Chaque semaine</button><button type="button" class="chip" data-r="once" aria-pressed="' + (rep === 'once') + '">Une seule fois</button></div></div>' +
    '<div class="field" id="ef-days-f"><span class="lbl">Jours</span><div class="days">' + dayChips + '</div></div>' +
    '<div class="field" id="ef-date-f"><label for="ef-date">Date</label><input id="ef-date" type="date" value="' + esc(e.date || todayStr()) + '"></div>' +
    '<div class="row nowrap"><div class="field" style="flex:1"><label for="ef-start">Début</label><input id="ef-start" type="time" value="' + e.start + '"></div><div class="field" style="flex:1"><label for="ef-end">Fin</label><input id="ef-end" type="time" value="' + e.end + '"></div></div>' +
    '<div class="field"><label for="ef-place">Lieu (facultatif)</label><input id="ef-place" type="text" maxlength="60" value="' + esc(e.place || '') + '"></div>' +
    '<div class="field"><span class="lbl">Couleur</span><div class="row">' + sw + '</div></div>' +
    '<p id="ef-err" class="err" role="alert"></p>' +
    '<div class="actions">' + (isNew ? '' : '<button type="button" class="btn danger" id="ef-del">Supprimer</button>') + '<span class="sp"></span><button type="button" class="btn ghost js-close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>' +
    '</form>',
    sheet => {
      const sync = () => { $('#ef-days-f', sheet).hidden = rep !== 'weekly'; $('#ef-date-f', sheet).hidden = rep !== 'once'; };
      sync();
      sheet.addEventListener('click', c => {
        const r = c.target.closest('[data-r]'), d = c.target.closest('[data-d]'), k = c.target.closest('[data-c]');
        if (r) {
          rep = r.dataset.r;
          sheet.querySelectorAll('[data-r]').forEach(b => b.setAttribute('aria-pressed', String(b === r)));
          sync();
        } else if (d) {
          const i = Number(d.dataset.d);
          if (days.has(i)) days.delete(i); else days.add(i);
          d.setAttribute('aria-pressed', String(days.has(i)));
        } else if (k) {
          color = Number(k.dataset.c);
          sheet.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', String(b === k)));
        }
      });
      if (!isNew) armDelete($('#ef-del', sheet), () => {
        state.events = state.events.filter(x => x.id !== e.id);
        save('planning'); closeSheet(); render();
      });
      $('#ef', sheet).addEventListener('submit', sv => {
        sv.preventDefault();
        const err = m => { $('#ef-err', sheet).textContent = m; };
        const title = $('#ef-title', sheet).value.trim();
        const start = $('#ef-start', sheet).value, end = $('#ef-end', sheet).value;
        const date = $('#ef-date', sheet).value;
        if (!title) return err('Donne un titre à l\'événement.');
        if (!start || !end) return err('Renseigne l\'heure de début et de fin.');
        if (toMin(end) <= toMin(start)) return err('L\'heure de fin doit être après le début.');
        if (rep === 'weekly' && !days.size) return err('Choisis au moins un jour.');
        if (rep === 'once' && !date) return err('Choisis une date.');
        const obj = { id: isNew ? uid8() : e.id, title: title, start: start, end: end, days: rep === 'weekly' ? Array.from(days).sort() : [], date: rep === 'once' ? date : '', color: color, place: $('#ef-place', sheet).value.trim() };
        if (isNew) state.events.push(obj); else state.events = state.events.map(x => x.id === e.id ? obj : x);
        save('planning'); closeSheet(); render();
      });
    });
}

/* ---------- Activités et remplissage de la semaine ---------- */
const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const PRIO_LABEL = ['', 'Priorité faible', 'Priorité normale', 'Priorité élevée'];
const weekDatesOf = offset => { const ws = addDays(weekStart(new Date()), offset * 7); return [0, 1, 2, 3, 4, 5, 6].map(i => ymd(addDays(ws, i))); };

let toastTimer = 0;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = '<span></span>' + (undo ? '<button type="button">Annuler</button>' : '');
  t.firstChild.textContent = msg;
  t.hidden = false;
  if (undo) t.querySelector('button').addEventListener('click', () => { undo(); t.hidden = true; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 8000);
}

function renderActs() {
  const dates = weekDatesOf(0);
  const count = id => state.events.filter(e => e.gen && e.act === id && dates.indexOf(e.date) !== -1).length;
  const row = a => '<li class="act" data-id="' + a.id + '"><button type="button" class="act-main">' +
    '<span class="dot c' + (a.color || 1) + '"></span>' +
    '<span class="act-txt"><span class="act-name">' + esc(a.name) + '</span>' + (a.goal ? '<span class="act-goal">' + esc(a.goal) + '</span>' : '') + (a.ex ? '<span class="tag-ex" style="justify-self:start">exemple</span>' : '') + '</span>' +
    '<span class="act-meta">' + PRIO_LABEL[a.weight || 2] + '<br>' + count(a.id) + ' cette semaine</span></button></li>';
  const sec = (h, title) => {
    const l = state.activities.filter(a => a.horizon === h);
    return l.length ? '<section class="grp"><h2 class="grp-h">' + title + '<span class="n">' + l.length + '</span></h2><ul class="tasks">' + l.map(row).join('') + '</ul></section>' : '';
  };
  let html = sec('moyen', 'Moyen terme') + sec('long', 'Long terme');
  if (!html) html = '<div class="empty"><p class="empty-t">Aucune activité pour l\'instant.</p><p>Ajoute ce qui compte à moyen et à long terme, puis remplis ta semaine d\'un geste.</p></div>';
  $('#act-list').innerHTML = html;
}

        if (isNew) state.activities.push(obj); else state.activities = state.activities.map(y => y.id === a.id ? obj : y);
        save('planning'); closeSheet(); render();
      });

}

    '<form id="sf" class="form" autocomplete="off">' +
    '<div class="field"><span class="lbl">Touche une activité pour remplacer celle-ci</span><div class="row">' + (chips || '<span class="act-goal">Aucune activité définie.</span>') + '</div></div>' +
    '<div class="row nowrap"><div class="field" style="flex:1"><label for="sf-start">Début</label><input id="sf-start" type="time" value="' + e.start + '"></div><div class="field" style="flex:1"><label for="sf-end">Fin</label><input id="sf-end" type="time" value="' + e.end + '"></div></div>' +
    '<p id="sf-err" class="err" role="alert"></p>' +
    '<div class="actions"><button type="button" class="btn danger" id="sf-del">Retirer</button><span class="sp"></span><button type="button" class="btn ghost js-close">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div>' +
    '</form>',
    sheet => {
      const commit = actId => {
        const s = $('#sf-start', sheet).value, f = $('#sf-end', sheet).value;
        if (!s || !f || toMin(f) <= toMin(s)) { $('#sf-err', sheet).textContent = 'L\'heure de fin doit être après le début.'; return; }
        const a = actById(actId);
        e.start = s; e.end = f; e.locked = true;
        if (a) { e.act = a.id; e.title = a.name; e.color = a.color; }
        save('planning'); closeSheet(); render();
      };
      sheet.addEventListener('click', c => { const b = c.target.closest('[data-a]'); if (b) commit(b.dataset.a); });
      armDelete($('#sf-del', sheet), () => {
        state.events = state.events.filter(x => x.id !== e.id);
        save('planning'); closeSheet(); render();
      });
      $('#sf', sheet).addEventListener('submit', sv => { sv.preventDefault(); commit(e.act); });
    });
}

function fillWeek() {
  if (!state.activities.length) { toast('Ajoute d\'abord une activité dans l\'onglet Activités.'); return; }
  const dates = weekDatesOf(state.weekOffset), ws = fromYmd(dates[0]), g = state.gen, t = todayStr();
  const backup = state.events;
  const keep = backup.filter(e => !(e.gen && !e.locked && dates.indexOf(e.date) !== -1));
  const lockedSlots = {}, usedByDay = {};
  keep.forEach(e => {
    if (e.gen && dates.indexOf(e.date) !== -1) {
      lockedSlots[e.date + e.slot] = true;
      if (e.act) (usedByDay[e.date] = usedByDay[e.date] || []).push(e.act);
    }
  });
  const slots = [];
  let skipped = 0, holSkip = false;
  g.days.forEach(i => {
    const d = addDays(ws, i), s = ymd(d);
    if (s < t) return;
    if (holidayOf(s)) { holSkip = true; return; }
    const busy = eventsOn(d, keep).map(e => [toMin(e.start), toMin(e.end)])
      .concat(state.tasks.filter(tk => tk.due === s && tk.time && !tk.done).map(tk => [toMin(tk.time), toMin(tk.end || plusMin(tk.time, 30))]));
    [['am', g.am], ['pm', g.pm]].forEach(p => {
      if (lockedSlots[s + p[0]]) return;
      const f = freeWindow(busy, toMin(p[1][0]), toMin(p[1][1]), 45);
      if (f) slots.push({ day: s, slot: p[0], start: hm(f[0]), end: hm(f[1]) }); else skipped++;
    });
  });
  if (!slots.length) { toast(skipped ? 'Ton agenda est déjà occupé sur ces créneaux.' : 'Aucun créneau à remplir sur cette semaine.'); return; }
  const acts = state.activities.map(a => ({ id: a.id, weight: a.weight || 2 }));
  const plan = planWeek(acts, slots, usedByDay, Math.random);
  const made = slots.map((s, i) => {
    const a = actById(plan[i]);
    return { id: uid8(), title: a.name, start: s.start, end: s.end, days: [], date: s.day, color: a.color, place: '', gen: true, act: a.id, slot: s.slot, locked: false };
  });
  state.events = keep.concat(made);
  save('planning'); render();
  toast(made.length + (made.length > 1 ? ' créneaux remplis' : ' créneau rempli') + (skipped ? ', ' + skipped + ' ignoré' + (skipped > 1 ? 's' : '') + ' (agenda occupé)' : '') + (holSkip ? ', jour férié ignoré' : ''),
    () => { state.events = backup; save('planning'); render(); });
}

function openFillSheet() {
  const g = state.gen;
  const days = new Set(g.days);
  const dayChips = DAY_ABBR.map((n, i) => '<button type="button" class="chip" data-d="' + i + '" aria-pressed="' + days.has(i) + '" aria-label="' + DAY_LONG[i] + '">' + n + '</button>').join('');
  const win = (id, label, w) => '<div class="row nowrap"><div class="field" style="flex:1"><label for="' + id + '-s">' + label + ', début</label><input id="' + id + '-s" type="time" value="' + w[0] + '"></div><div class="field" style="flex:1"><label for="' + id + '-e">' + label + ', fin</label><input id="' + id + '-e" type="time" value="' + w[1] + '"></div></div>';
  openSheet(
    '<h2 id="sheet-title" class="sheet-t">Remplir la semaine</h2>' +
    '<form id="ff" class="form" autocomplete="off">' +
    '<p class="acts-hint">Une activité le matin et une l\'après-midi, choisies selon leur priorité. Les trous de ton agenda sont respectés et les créneaux que tu as modifiés sont conservés. Relancer « Remplir » change la répartition des autres.</p>' +
    '<div class="field"><span class="lbl">Jours à remplir</span><div class="days">' + dayChips + '</div></div>' +
    win('ff-am', 'Matin', g.am) + win('ff-pm', 'Après-midi', g.pm) +
    '<p id="ff-err" class="err" role="alert"></p>' +
    '<div class="actions"><button type="button" class="btn danger" id="ff-clear">Vider la semaine</button><span class="sp"></span><button type="button" class="btn ghost js-close">Annuler</button><button type="submit" class="btn primary">Remplir</button></div>' +
    '</form>',
    sheet => {
      sheet.addEventListener('click', c => {
        const d = c.target.closest('[data-d]');
        if (!d) return;
        const i = Number(d.dataset.d);
        if (days.has(i)) days.delete(i); else days.add(i);
        d.setAttribute('aria-pressed', String(days.has(i)));
      });
      armDelete($('#ff-clear', sheet), () => {
        const dates = weekDatesOf(state.weekOffset), backup = state.events;
        state.events = state.events.filter(e => !(e.gen && dates.indexOf(e.date) !== -1));
        save('planning'); closeSheet(); render();
        toast('Créneaux de la semaine effacés', () => { state.events = backup; save('planning'); render(); });
      });
      $('#ff', sheet).addEventListener('submit', sv => {
        sv.preventDefault();
        const am = [$('#ff-am-s', sheet).value, $('#ff-am-e', sheet).value], pm = [$('#ff-pm-s', sheet).value, $('#ff-pm-e', sheet).value];
        const bad = w => !w[0] || !w[1] || toMin(w[1]) <= toMin(w[0]);
        if (!days.size) { $('#ff-err', sheet).textContent = 'Choisis au moins un jour.'; return; }
        if (bad(am) || bad(pm)) { $('#ff-err', sheet).textContent = 'Les heures de fin doivent être après les heures de début.'; return; }
        state.gen = { days: Array.from(days).sort(), am: am, pm: pm };
        closeSheet();
        fillWeek();
      });
    });
}

$('#act-add').addEventListener('click', () => openActSheet(null));
$('#act-list').addEventListener('click', ev => {
  const li = ev.target.closest('.act');
  const a = li && state.activities.find(x => x.id === li.dataset.id);
  if (a) openActSheet(a);
});
$('#wk-fill').addEventListener('click', openFillSheet);

/* ---------- Interactions ---------- */
function setTab(tab) {
  state.tab = TABS.indexOf(tab) !== -1 ? tab : 'taches';
  try { if (location.hash !== '#' + state.tab) location.hash = state.tab; } catch (e) {}
  render();
}
document.querySelectorAll('.tabs a').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); setTab(a.dataset.tab); }));
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TABS.indexOf(h) !== -1 && h !== state.tab) { state.tab = h; render(); }
});

/* Ajout rapide */
const qaDate = $('#qa-date');
function syncChips() {
  const t = todayStr(), tm = ymd(addDays(new Date(), 1));
  $('#qa-today').setAttribute('aria-pressed', String(qaDate.value === t));
  $('#qa-tomorrow').setAttribute('aria-pressed', String(qaDate.value === tm));
}
$('#qa-today').addEventListener('click', () => { qaDate.value = qaDate.value === todayStr() ? '' : todayStr(); syncChips(); });
$('#qa-tomorrow').addEventListener('click', () => { const tm = ymd(addDays(new Date(), 1)); qaDate.value = qaDate.value === tm ? '' : tm; syncChips(); });
qaDate.addEventListener('change', syncChips);
const qaTs = $('#qa-ts'), qaTe = $('#qa-te');
function syncTimeChips() {
  $('#qa-midi').setAttribute('aria-pressed', String(qaTs.value === '12:00' && qaTe.value === '14:00'));
  $('#qa-soir').setAttribute('aria-pressed', String(qaTs.value === '19:00' && qaTe.value === '23:00'));
}
function toggleSlot(a, b) {
  const on = qaTs.value === a && qaTe.value === b;
  qaTs.value = on ? '' : a; qaTe.value = on ? '' : b;
  syncTimeChips();
}
$('#qa-midi').addEventListener('click', () => toggleSlot('12:00', '14:00'));
$('#qa-soir').addEventListener('click', () => toggleSlot('19:00', '23:00'));
qaTs.addEventListener('change', syncTimeChips);
qaTe.addEventListener('change', syncTimeChips);

/* Ce que l'app va créer : champs manuels d'abord, puis ce qui est compris dans le texte */
function qaCompute(raw) {
  const p = raw ? parseQuick(raw) : { title: '', due: '', time: '', end: '' };
  const ts = qaTs.value || p.time;
  const te = qaTs.value ? ((qaTe.value && toMin(qaTe.value) > toMin(qaTs.value)) ? qaTe.value : '') : p.end;
  const due = qaDate.value || p.due || (ts ? todayStr() : '');
  return { p: p, ts: ts, te: te, due: due };
}
function qaRefresh() {
  syncChips(); syncTimeChips();
  const raw = $('#qa-title').value.trim();
  const c = qaCompute(raw);
  $('#qa-pen').toggleAttribute('hidden', !!raw);
  $('#qa-em').hidden = !raw;
  $('#qa-em').textContent = raw ? pickEmoji(c.p.title) : '';
  const pv = $('#qa-preview');
  if (c.due || c.ts) {
    pv.classList.remove('hint');
    $('#qa-pv').textContent = (c.due ? dueLabel(c.due) : '') + (c.ts ? (c.due ? ' · ' : '') + c.ts + '–' + (c.te || plusMin(c.ts, 30)) : '');
  } else {
    pv.classList.add('hint');
    $('#qa-pv').textContent = 'Astuce : « demain soir » ou « à 14h30 »';
  }
  const t = todayStr(), tm = ymd(addDays(new Date(), 1)), dv = qaDate.value;
  const dOn = !!dv && dv !== t && dv !== tm;
  $('#qa-date-p').classList.toggle('on', dOn);
  $('#qa-date-p .pick-t').textContent = dOn ? fr(fromYmd(dv), { weekday: 'short', day: 'numeric', month: 'short' }) : 'Date';
  $('#qa-ts-p').classList.toggle('on', !!qaTs.value);
  $('#qa-ts-p .pick-t').textContent = qaTs.value || 'Heure';
  $('#qa-te-p').hidden = !qaTs.value;
  $('#qa-te-p').classList.toggle('on', !!qaTe.value);
  $('#qa-te-p .pick-t').textContent = qaTe.value ? '→ ' + qaTe.value : 'Fin';
}
['input', 'change', 'click'].forEach(ev => $('#qa').addEventListener(ev, qaRefresh));
document.querySelectorAll('.pick-in').forEach(i => i.addEventListener('click', () => { try { if (i.showPicker) i.showPicker(); } catch (e) {} }));
$('#qa').addEventListener('submit', ev => {
  ev.preventDefault();
  const input = $('#qa-title');
  const raw = input.value.trim();
  if (!raw) { input.focus(); return; }
  const { p, ts, te, due } = qaCompute(raw);
  state.tasks.push({ id: uid8(), title: p.title, emoji: pickEmoji(p.title), due: due, time: ts, end: ts ? (te || plusMin(ts, 30)) : '', done: false, created: Date.now() });
  state.known.todo = true;
  input.value = ''; qaDate.value = ''; qaTs.value = ''; qaTe.value = ''; state.qaPrio = false; qaRefresh();
  syncChips();
  save('todo'); render(); input.focus();
});

/* Liste des tâches */
$('#task-list').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'toggle-done') { state.showDone = !state.showDone; renderTasks(); return; }
  const li = b.closest('.task');
  const t = li && state.tasks.find(x => x.id === li.dataset.id);
  if (!t) return;
  if (b.dataset.act === 'toggle') {
    t.done = !t.done; t.doneAt = t.done ? Date.now() : 0;
    save('todo'); render();
  } else if (b.dataset.act === 'edit') openTaskSheet(t);
});

/* Semaine */
$('#wk-prev').addEventListener('click', () => { state.weekOffset--; renderWeek(); });
$('#wk-next').addEventListener('click', () => { state.weekOffset++; renderWeek(); });
$('#wk-today').addEventListener('click', () => { state.weekOffset = 0; state.selDay = dow(new Date()); renderWeek(); });
$('#wk-add').addEventListener('click', () => {
  const ws = addDays(weekStart(new Date()), state.weekOffset * 7);
  openEventSheet(null, { day: state.selDay, date: ymd(addDays(ws, state.selDay)) });
});
$('#strip').addEventListener('click', ev => {
  const b = ev.target.closest('[data-sel]');
  if (b) { state.selDay = Number(b.dataset.sel); renderWeek(); }
});
$('#timetable').addEventListener('click', ev => {
  const tg = ev.target.closest('[data-tk-toggle]');
  if (tg) {
    const t = state.tasks.find(x => x.id === tg.dataset.tkToggle);
    if (t) { t.done = !t.done; t.doneAt = t.done ? Date.now() : 0; save('todo'); render(); }
    return;
  }
  const te = ev.target.closest('[data-tk-edit]');
  if (te) { const t = state.tasks.find(x => x.id === te.dataset.tkEdit); if (t) openTaskSheet(t); return; }
  const evBtn = ev.target.closest('[data-ev]');
  if (evBtn) { const e = state.events.find(x => x.id === evBtn.dataset.ev); if (e) { if (e.gen) openSlotSheet(e); else openEventSheet(e); } return; }
  if (ev.target.closest('[data-goto-tasks]')) { setTab('taches'); return; }
  const body = ev.target.closest('.col-b');
  if (body && ev.target === body) {
    const hh = 48, y = ev.clientY - body.getBoundingClientRect().top;
    const h = Math.max(0, Math.min(22, Number(body.dataset.minh) + Math.floor(y / hh)));
    const i = Number(body.dataset.day);
    const ws = addDays(weekStart(new Date()), state.weekOffset * 7);
    openEventSheet(null, { day: i, date: ymd(addDays(ws, i)), start: pad(h) + ':00', end: pad(h + 1) + ':00' });
  }
});

/* Effacer les exemples */
$('#ex-clear').addEventListener('click', () => {
  state.tasks = state.tasks.filter(t => !t.ex);
  const gone = state.activities.filter(a => a.ex).map(a => a.id);
  state.activities = state.activities.filter(a => !a.ex);
  state.events = state.events.filter(e => !e.ex && !(e.act && gone.indexOf(e.act) !== -1));
  save('todo'); save('planning'); render();
});

/* Horloge : met à jour l'indicateur d'heure et le résumé */
setInterval(() => { if (!sheetRoot.firstChild) render(); }, 60000);

/* ---------- Démarrage ---------- */
(function boot() {
  const h = location.hash.slice(1);
  state.tab = TABS.indexOf(h) !== -1 ? h : 'taches';
  qaRefresh();
  const lt = readLocal('todo'), lp = readLocal('planning');
  if (lt && Array.isArray(lt.tasks)) { state.tasks = lt.tasks; state.known.todo = true; }
  if (lp && Array.isArray(lp.events)) {
    state.events = lp.events;
    state.activities = Array.isArray(lp.activities) ? lp.activities : exampleActivities();
    state.gen = lp.gen || defaultGen();
    state.seeded = Array.isArray(lp.seeded) ? lp.seeded : [];
    state.known.planning = true;
  }
  render();
  initSync();
})();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
